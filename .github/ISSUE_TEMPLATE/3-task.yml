name: Task
description: "Work that is neither a feature nor a bug, e.g. refactoring, config, tests (기능 추가나 버그가 아닌 작업. 예: 리팩터링, 설정, 테스트 보강)"
type: Task
body:
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 무엇을 하는지
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 배경
      description: 왜 필요한지, 지금 하지 않으면 어떤 문제가 있는지

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 어떤 상태가 되면 끝난 것으로 볼지
