name: Bug
description: 의도와 다르게 동작하는 문제
type: Bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: 현상
      description: 무엇이 잘못됐고, 원래는 어떻게 동작해야 하는지
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 / 로그
      description: 재현 순서, 에러 메시지, 로그 등

  - type: textarea
    id: notes
    attributes:
      label: 메모
      description: 원인 추정, 관련 이슈나 PR 등
